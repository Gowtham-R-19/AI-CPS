# ==============================================================================
# Title: Data Provision & Verification Orchestration — Cyber Attack Detection
#        (Learning Base & Activation Base Validation)
#
# Course: M. Grum – Advanced AI-based Application Systems
# Track: Data Science and Business Analytics
# Instructor: Prof. Dr. Marcus Grum
# Chair: Junior Chair for Business Information Science, especially AI-based Application Systems
# Institution: University of Potsdam, Germany
# Authors: Gowtham Ramakrishna, Vaishnavi Vijaya
#
# Purpose:
# - Validate that the learningBase and activationBase container images correctly
#   provision training, validation, and activation datasets
# - Mount all data into a shared external volume (ai_system) to simulate the
#   production data exchange pattern used by training and inference pipelines
# - Verify dataset availability, structure, and accessibility through an
#   automated inspection and reporting service
#
# Description:
# This Docker Compose configuration orchestrates a multi-service data validation
# workflow that provisions training, validation, and activation datasets from
# dedicated container images into a shared external volume. It executes a
# verification service to confirm data presence, directory structure, and
# accessibility, ensuring deterministic and reproducible data provisioning
# across the cyber attack detection system.
#
# Key Design Principles:
# - Separation of concerns between data provision and data verification services
# - Deterministic inter-container data exchange via a shared external volume
# - Automated validation and human-readable reporting
# - Architectural consistency with training and inference orchestration layers
#
# ==============================================================================

version: '3.8'

services:
  # Learning base service - provides training and testing data
  learning:
    image: ghost5555/learningbase_cyberattackdetection:latest
    container_name: cyber_learning_base
    volumes:
      - ai_system:/tmp
    command: >
      sh -c "
      echo '=== learningBase Data Provision ===';
      echo 'Training data:';
      ls -lh /tmp/learningBase/train/;
      echo '';
      echo 'Validation data:';
      ls -lh /tmp/learningBase/validation/;
      echo '';
      cp -r /tmp/learningBase/* /tmp/ 2>/dev/null || echo 'Data already in volume';
      echo 'Data successfully mounted to ai_system volume';
      "

  # Activation base service - provides inference sample data
  activation:
    image: ghost5555/activationbase_cyberattackdetection:latest
    container_name: cyber_activation_base
    volumes:
      - ai_system:/tmp/shared
    depends_on:
      - learning
    command: >
      sh -c "
      echo '=== activationBase Data Provision ===';
      echo 'Activation data in image:';
      ls -lh /tmp/activationBase/;
      echo '';
      echo 'Copying to shared volume:';
      cp -r /tmp/activationBase /tmp/shared/;
      echo '';
      echo 'Sample count:';
      wc -l /tmp/shared/activationBase/activation_data.csv;
      echo '';
      echo 'Data successfully mounted to ai_system volume';
      "

  # Verification service - checks that all data is accessible
  verify:
    image: busybox:latest
    container_name: cyber_data_verify
    volumes:
      - ai_system:/tmp
    depends_on:
      - learning
      - activation
    command: >
      sh -c "
      sleep 2;  # Wait for data to be copied
      echo '';
      echo '=== Verifying All Data ===';
      echo '';
      echo 'Checking learningBase:';
      test -f /tmp/learningBase/train/training_data.csv && echo '✅ training_data.csv exists' || echo '❌ training_data.csv missing';
      test -f /tmp/learningBase/validation/test_data.csv && echo '✅ test_data.csv exists' || echo '❌ test_data.csv missing';
      echo '';
      echo 'Checking activationBase:';
      test -f /tmp/activationBase/activation_data.csv && echo '✅ activation_data.csv exists' || echo '❌ activation_data.csv missing';
      echo '';
      echo '=== Verification Complete ===';
      echo 'All data images are working correctly!';
      echo '';
      echo 'Volume contents:';
      ls -lR /tmp/;
      "

volumes:
  ai_system:
    external: true

networks:
  default:
    name: cyber_attack_detection_network
