# ============================================================
# docker-compose.yml — OLS Inference
# Course: M. Grum – Advanced AI-based Application Systems
# University of Potsdam
#
# Purpose:
# - Apply OLS (logistic regression) model
# - Same infrastructure as ANN
# - Only difference: inference mode
#
# Professor requirement:
# - External volume "ai_system"
# - Mounted as /tmp in ALL containers
# ============================================================

version: "3.8"

services:

  # ------------------------------------------------------------
  # Activation Base
  # Provides activation_data.csv at /tmp/activationBase
  # ------------------------------------------------------------
  activationbase:
    image: ghost5555/activationbase_cyberattackdetection:latest
    volumes:
      - ai_system:/tmp

  # ------------------------------------------------------------
  # Knowledge Base
  # Copies OLS model into /tmp/knowledgeBase at container start
  # ------------------------------------------------------------
  knowledgebase:
    image: vaishnavivijaya2002/knowledgebase_cyberattackdetection:latest
    volumes:
      - ai_system:/tmp

  # ------------------------------------------------------------
  # Code Base – OLS Inference
  # Runs predict.py with OLS model
  # ------------------------------------------------------------
  codebase_ols:
    image: vaishnavivijaya2002/codebase_cyberattackdetection:latest
    depends_on:
      - activationbase
      - knowledgebase
    volumes:
      - ai_system:/tmp
    environment:
      - TF_CPP_MIN_LOG_LEVEL=3
      - CUDA_VISIBLE_DEVICES=-1
      - PYTHONUNBUFFERED=1
    command: ["--model", "ols"]

volumes:
  ai_system:
    external: true
