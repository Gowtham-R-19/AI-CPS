# ==============================================================================
# Title: ANN Inference Orchestration — Cyber Attack Detection (Docker Compose)
#
# Course: M. Grum – Advanced AI-based Application Systems
# Track: Data Science and Business Analytics
# Instructor: Prof. Dr. Marcus Grum
# Chair: Junior Chair for Business Information Science, especially AI-based Application Systems
# Institution: University of Potsdam, Germany
# Authors: Gowtham Ramakrishna, Vaishnavi Vijaya
#
# Purpose:
# - Apply the trained ANN model to activation data for cyber attack detection
# - Coordinate activation data, trained model artifacts, and inference runtime
#   across isolated containers
# - Enforce the use of a shared external volume (ai_system) mounted at /tmp in
#   all services, as required for deterministic data and model exchange
#
# Description:
# This Docker Compose configuration orchestrates a multi-container inference
# workflow for cyber attack detection using an ANN model. It coordinates the
# activation data provider, trained model provider, and Python-based inference
# runtime, and enforces a shared external volume to enable deterministic and
# reproducible data and model exchange across all services.
#
# Key Design Principles:
# - Multi-container separation of data, models, and execution logic
# - Deterministic inter-container communication via a shared external volume
# - Explicit dependency ordering for reliable startup sequencing
# - Seamless integration with ANN-based inference pipelines
#
# ==============================================================================

version: "3.8"

services:

  # ------------------------------------------------------------
  # Activation Base
  # Provides activation_data.csv at /tmp/activationBase
  # ------------------------------------------------------------
  activationbase:
    image: ghost5555/activationbase_cyberattackdetection:latest
    volumes:
      - ai_system:/tmp

  # ------------------------------------------------------------
  # Knowledge Base
  # Copies models into /tmp/knowledgeBase at container start
  # ------------------------------------------------------------
  knowledgebase:
    image: vaishnavivijaya2002/knowledgebase_cyberattackdetection:latest
    volumes:
      - ai_system:/tmp

  # ------------------------------------------------------------
  # Code Base – ANN Inference
  # Runs predict.py with ANN model
  # ------------------------------------------------------------
  codebase_ann:
    image: vaishnavivijaya2002/codebase_cyberattackdetection:latest
    depends_on:
      - activationbase
      - knowledgebase
    volumes:
      - ai_system:/tmp
    environment:
      - TF_CPP_MIN_LOG_LEVEL=3
      - CUDA_VISIBLE_DEVICES=-1
      - PYTHONUNBUFFERED=1
    # ENTRYPOINT: python predict.py
    # CMD default: --model ann

volumes:
  ai_system:
    external: true
