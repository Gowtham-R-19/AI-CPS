# ==============================================================================
# Title: OLS Inference Orchestration — Cyber Attack Detection (Docker Compose)
#
# Course: M. Grum – Advanced AI-based Application Systems
# Track: Data Science and Business Analytics
# Instructor: Prof. Dr. Marcus Grum
# Chair: Junior Chair for Business Information Science, especially AI-based Application Systems
# Institution: University of Potsdam, Germany
# Authors: Gowtham Ramakrishna, Vaishnavi Vijaya
#
# Purpose:
# - Apply the trained OLS (logistic regression) model to activation data for
#   cyber attack detection
# - Reuse the same multi-container infrastructure as the ANN pipeline to enable
#   controlled, side-by-side performance comparison
# - Enforce the use of a shared external volume (ai_system) mounted at /tmp in
#   all services for deterministic data and model exchange
#
# Description:
# This Docker Compose configuration orchestrates a multi-container inference
# workflow for cyber attack detection using an OLS-based logistic regression
# model. It coordinates the activation data provider, trained model provider,
# and Python-based inference runtime, and enforces a shared external volume to
# ensure reproducible and comparable inference execution across experimental
# baselines.
#
# Key Design Principles:
# - Architectural symmetry with the ANN inference pipeline
# - Deterministic inter-container communication via a shared external volume
# - Explicit dependency ordering for reliable startup sequencing
# - Standardized execution for fair baseline comparison
#
# ==============================================================================

version: "3.8"

services:

  # ------------------------------------------------------------
  # Activation Base
  # Provides activation_data.csv at /tmp/activationBase
  # ------------------------------------------------------------
  activationbase:
    image: ghost5555/activationbase_cyberattackdetection:latest
    volumes:
      - ai_system:/tmp

  # ------------------------------------------------------------
  # Knowledge Base
  # Copies OLS model into /tmp/knowledgeBase at container start
  # ------------------------------------------------------------
  knowledgebase:
    image: vaishnavivijaya2002/knowledgebase_cyberattackdetection:latest
    volumes:
      - ai_system:/tmp

  # ------------------------------------------------------------
  # Code Base – OLS Inference
  # Runs predict.py with OLS model
  # ------------------------------------------------------------
  codebase_ols:
    image: vaishnavivijaya2002/codebase_cyberattackdetection:latest
    depends_on:
      - activationbase
      - knowledgebase
    volumes:
      - ai_system:/tmp
    environment:
      - TF_CPP_MIN_LOG_LEVEL=3
      - CUDA_VISIBLE_DEVICES=-1
      - PYTHONUNBUFFERED=1
    command: ["--model", "ols"]

volumes:
  ai_system:
    external: true
