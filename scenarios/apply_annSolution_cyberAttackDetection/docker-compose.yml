# ============================================================
# docker-compose.yml — ANN Inference
# Course: M. Grum – Advanced AI-based Application Systems
# University of Potsdam
#
# Purpose:
# - Apply ANN model to activation data
# - Uses three Docker images:
#   1) activationBase  → provides activation_data.csv
#   2) knowledgeBase   → provides trained ANN model
#   3) codeBase        → runs inference logic
#
# Professor requirement:
# - External volume "ai_system"
# - Mounted as /tmp in ALL containers
# ============================================================

version: "3.8"

services:

  # ------------------------------------------------------------
  # Activation Base
  # Provides activation_data.csv at /tmp/activationBase
  # ------------------------------------------------------------
  activationbase:
    image: ghost5555/activationbase_cyberattackdetection:latest
    volumes:
      - ai_system:/tmp

  # ------------------------------------------------------------
  # Knowledge Base
  # Copies models into /tmp/knowledgeBase at container start
  # ------------------------------------------------------------
  knowledgebase:
    image: vaishnavivijaya2002/knowledgebase_cyberattackdetection:latest
    volumes:
      - ai_system:/tmp

  # ------------------------------------------------------------
  # Code Base – ANN Inference
  # Runs predict.py with ANN model
  # ------------------------------------------------------------
  codebase_ann:
    image: vaishnavivijaya2002/codebase_cyberattackdetection:latest
    depends_on:
      - activationbase
      - knowledgebase
    volumes:
      - ai_system:/tmp
    environment:
      - TF_CPP_MIN_LOG_LEVEL=3
      - CUDA_VISIBLE_DEVICES=-1
      - PYTHONUNBUFFERED=1
    # ENTRYPOINT: python predict.py
    # CMD default: --model ann

volumes:
  ai_system:
    external: true